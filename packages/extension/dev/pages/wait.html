<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fixture wait</title>
</head>
<body>
  <h1>Fixture wait</h1>
  <p id="late">wait page</p>
  <script type="module">
    setTimeout(() => {
      const line = document.createElement("p")
      line.textContent = "delayed ready"
      document.body.append(line)
    }, 400)
    setTimeout(() => {
      document.getElementById("late").textContent = "late ready"
    }, 1200)
  </script>
</body>
</html>
