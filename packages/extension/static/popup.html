<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Chromium Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Codex Bridge</h1>
      <p id="status" class="status">Checking…</p>
      <dl>
        <div><dt>Native host</dt><dd id="native-host">—</dd></div>
        <div><dt>Controlled tabs</dt><dd id="lease-count">0</dd></div>
      </dl>

      <h2>Agents</h2>
      <label id="observe-control"><input id="observe" type="checkbox" /> Allow agents on this tab</label>
      <p id="browser-mode"></p>
      <ul id="clients" class="clients"></ul>

      <h2>Activity</h2>
      <ul id="events" class="events"></ul>

      <button id="disconnect" type="button">Release all tabs</button>
      <p id="message" class="message" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
